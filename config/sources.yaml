# Which sources run and their limits. Everything here is free.
llm:
  model: claude-haiku-5-5          # extraction + second-pass check
  max_chars_per_business: 14000
crawl:
  user_agent: "TryuuResearchBot/1.0"
  delay_seconds: 1.0               # per host
  timeout_seconds: 15
  max_pages: 6
  workers: 8
  page_keywords: [contact, about, team, staff, our-story, services, pricing, book, trial, free, class, consult, appointment, schedule]
booking_hosts: [mindbodyonline.com, acuityscheduling.com, calendly.com, janeapp.com, squareup.com, square.site, setmore.com, vagaro.com, fresha.com, booksy.com, jotform.com, wellnessliving.com, zenoti.com]
discover:
  gosom: {enabled: true}                       # run via Docker, results ingested with: 01_discover.py gosom <csv>
  overpass: {enabled: true, url: "https://overpass-api.de/api/interpreter", max_per_query: 2000}
  licences: {enabled: true}                    # municipal open-data CSVs, ingested with: 01_discover.py licences <csv>
  directories: {enabled: false}                # only where robots/terms allow; enable per directory deliberately
verify:
  prefer: reacher                  # reacher | instantly ; Reacher needs outbound port 25 and REACHER_URL
  max_age_days: 14
google_places: {enabled: false, hard_quota_per_month: 4000}
offlimits: [yelp.com, yellowpages.ca, cylex.ca, showmelocal.com, classpass.com, mapquest.com, foursquare.com]
load:
  max_batch: 200          # pilot size per segment; raise only after a gate is met
  min_precision: 0.90     # research precision required before loading (plan 9.2 rule 5)
