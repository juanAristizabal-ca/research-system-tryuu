# Category catalogue. Tryuu welcomes EVERY kind of business (individuals to global brands); research is run per category.
# Order matters: the first category whose `types` substring matches a business type wins, so specific ones come first.
# types      substrings matched (lower case) against the business type text (Instantly export / Master sheet / site extraction)
# keywords   Google Maps / directory search terms used by 01_discover (gosom)
# campaigns  legacy Instantly campaign codes that already searched this category (F003 cars/home/auto is still pending approval)
# proven     true = score bonus (segments with onboards so far); change only through scoring evidence (plan section 8.4)
# Coverage numbers are NOT stored here: run `python pipeline/category_report.py` (reads the database).

groups:
  fitness_movement: Fitness and movement
  learning: Learning and kids
  health_wellness: Health and wellness
  beauty: Beauty and personal care
  professional: Professional and financial services
  home_services: Home services and construction
  auto: Automotive
  food_drink: Food, drink and nightlife
  retail: Retail and shops
  experiences: Experiences, events and travel
  creative: Creative, arts and media
  pets: Pets and animals
  brands: "Brands, chains and franchises (separate track, corporate contacts)"
  excluded: Not targets (associations, consulates, government)

categories:
